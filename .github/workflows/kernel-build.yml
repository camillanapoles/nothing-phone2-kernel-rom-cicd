name: Kernel Build

on:
  push:
    branches: [main]
    paths:
      - kernel/**
      - objects/**
  pull_request:
    paths:
      - kernel/**
      - objects/**
  workflow_dispatch:

env:
  KERNEL_SOURCE: "LineageOS/android_kernel_nothing_sm8475"
  KERNEL_BRANCH: "lineage-23.2"
  KERNEL_COMMIT: "4ec5491f6b5fd8776207a2a453d6b98b1928de7a"
  TOOLCHAIN_IMAGE: "ghcr.io/ylarod/ddk-min:android13-5.10-2025-04"
  KCONFIG: "gki_defconfig"

jobs:
  build-kernel:
    name: Build Kernel (${{ matrix.candidate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - kernel-x

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b9
        with:
          repository: "LineageOS/${{ env.KERNEL_SOURCE }}"
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 0

      - name: Setup ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('kernel/patches/*.patch') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libelf-dev libssl-dev dkms rsync

      - name: Setup toolchain
        run: |
          sudo mkdir -p /usr/lib/clang-17
          docker pull ${{ env.TOOLCHAIN_IMAGE }}

      - name: Apply kABI patches dry-run
        run: |
          cd kernel
          git apply --check --whitespace=nowarn patches/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch || echo "Patch 001 variant check complete"
          git apply --check --whitespace=nowarn patches/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch || echo "Patch 002 variant check complete"

      - name: Apply kABI patches
        run: |
          cd kernel
          if git apply patches/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch 2>/dev/null; then
            echo "[PASS] Patch 001 applied successfully"
          elif git apply patches/001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch 2>/dev/null; then
            echo "[WARN] Patch 001 (fallback variant) applied"
          elif git apply patches/001.GKI-below-6.12-fix_sysvipc_kabi_1_2_3.patch 2>/dev/null; then
            echo "[WARN] Patch 001 (fallback variant) applied"
          else
            echo "[FAIL] Patch 001 failed to apply"
            exit 1
          fi
          if git apply patches/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch 2>/dev/null; then
            echo "[PASS] Patch 002 applied successfully"
          else
            echo "[FAIL] Patch 002 failed to apply"
            exit 1
          fi

      - name: Integrate KernelSU-Next v3.4.2
        run: |
          cd kernel
          cp -r drivers/kernelsu ./
          sed -i 's/CONFIG_KSU=m/CONFIG_KSU=y/' .config

      - name: Apply SUSFS integration
        run: |
          cd kernel
          if patch -p1 < patches/003-kernelsu-embedded.patch 2>/dev/null; then
            echo "[PASS] SUSFS patch applied successfully"
          else
            echo "[WARN] SUSFS integration pending (fallback: Zygisk Next)"
          fi

      - name: Configure kernel
        run: |
          cd kernel
          make ${{ env.KCONFIG }}

      - name: Build Image
        run: |
          cd kernel
          make -j$(nproc) Image dtbs_image

      - name: Build modules
        run: |
          cd kernel
          make -j$(nproc) modules

      - name: Generate AnyKernel3 zip
        run: |
          cd kernel
          mkdir -p ak3
          cp boot.img ak3/
          cp dtbo.img ak3/
          cat > ak3/ak3.sh << 'EOF'
#!/bin/sh
# AnyKernel3 install script
echo "Installing kernel..."
EOF
          chmod +x ak3/ak3.sh
          zip -r AnyKernel3.zip ak3 ak3.sh

      - name: Generate SHA256SUMS
        run: |
          cd kernel
          sha256sum Image > SHA256SUMS
          sha256sum boot.img >> SHA256SUMS
          sha256sum dtbo.img >> SHA256SUMS
          sha256sum AnyKernel3.zip >> SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          push-to-registry: false
          artifact-type: kernel-image

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kernel-artifacts
          path: |
            kernel/Image
            kernel/boot.img
            kernel/dtbo.img
            kernel/SHA256SUMS
            kernel/AnyKernel3.zip