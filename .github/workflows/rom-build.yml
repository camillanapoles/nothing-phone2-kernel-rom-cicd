name: ROM Build & Package

on:
  push:
    branches: [main]
    paths:
      - objects/rom-artifacts.json
  workflow_dispatch:
    inputs:
      variant:
        description: 'ROM variant to build'
        required: true
        default: 'vanilla'
        type: choice
        options:
          - vanilla
          - gapps

jobs:
  rom-build:
    name: Build Evolution X ROM
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # Checkout with pinned action
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Setup ccache
      - name: Setup ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-rom-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-rom-

      # Install build dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-11-jdk \
            python3 \
            python3-pip \
            git-core \
            gnupg \
            flex \
            bison \
            gperf \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            rsync \
            ccache \
            schedtool \
            liblz4-tool \
            libssl-dev \
            bc

      # Download ROM artifact (pre-built)
      - name: Download ROM artifact
        id: download_rom
        run: |
          python3 - << 'PY'
import json, sys, subprocess, hashlib, os

with open('objects/rom-artifacts.json') as f:
    data = json.load(f)

variant = os.getenv('VARIANT', 'vanilla')
variants = [v for v in data['variants'] if v['id'] == variant]
if not variants:
    print(f"[FAIL] Variant '{variant}' not found")
    sys.exit(1)

rom = variants[0]
url = rom['url']
expected_sha256 = rom['sha256']
filename = rom['filename']

print(f"Downloading {filename}...")
result = subprocess.run(['wget', '-q', '-O', filename, url], capture_output=True)
if result.returncode != 0:
    print(f"[FAIL] Download failed: {result.stderr.decode()}")
    sys.exit(1)

# Verify SHA256
print("Verifying SHA256...")
sha256_hash = hashlib.sha256()
with open(filename, 'rb') as f:
    for chunk in iter(lambda: f.read(4096), b""):
        sha256_hash.update(chunk)
actual_sha256 = sha256_hash.hexdigest()

if actual_sha256 != expected_sha256:
    print(f"[FAIL] SHA256 mismatch!")
    print(f"  Expected: {expected_sha256}")
    print(f"  Actual:   {actual_sha256}")
    sys.exit(1)

print(f"[PASS] SHA256 verified: {actual_sha256}")
print(f"filename={filename}")
print(f"sha256={actual_sha256}")
with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
    out.write(f"filename={filename}\n")
    out.write(f"sha256={actual_sha256}\n")
PY
        env:
          VARIANT: ${{ github.event.inputs.variant || 'vanilla' }}

      # Generate SHA256SUMS for ROM
      - name: Generate SHA256SUMS
        run: |
          echo "${{ steps.download_rom.outputs.sha256 }}  ${{ steps.download_rom.outputs.filename }}" > SHA256SUMS
          cat SHA256SUMS

      # Attest build provenance (for downloaded artifact - document provenance)
      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          push-to-registry: false
          artifact-type: "rom-image"

      # Create release draft
      - name: Create release draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: true
          prerelease: false
          tag_name: "evox-${{ github.event.inputs.variant || 'vanilla' }}-${{ github.sha::8 }}"
          name: "Evolution X 11.11 ${{ github.event.inputs.variant || 'vanilla' }} - ${{ github.sha::8 }}"
          body: |
            Evolution X 11.11 build for Nothing Phone 2 (pong)

            **Variant:** ${{ github.event.inputs.variant || 'vanilla' }}
            **Build:** 20260915-Pong-11.11
            **SHA256:** ${{ steps.download_rom.outputs.sha256 }}
            **Source:** Evolution X official CDN

            ## Installation (Slot A only)
            This release is for Slot A only. Follow `INSTALL-SEQUENCE.md` for the complete Slot A installation procedure.

            **F1 Base Flash:** `fastboot flash --slot=a firmware.bin` + `fastboot flash --slot=a boot` + sideload EvolutionX Vanilla
            **F3 Root:** `fastboot flash boot_a boot-ksu.img` + verify `su -c id` returns uid=0
            **F5 Integrity:** PIFork + TEESimulator-RS Enhanced + keybox.xml
            **F6 Apps:** CircleToSearch (e4f4614), Morphe v2.3.0, Gemini
            **F7 Performance:** Universal GMS Doze 1.9.11
          files: |
            ${{ steps.download_rom.outputs.filename }}
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Summary
      - name: ROM Build Summary
        if: success()
        run: |
          echo "✅ ROM artifact downloaded and verified"
          echo "📦 Variant: ${{ github.event.inputs.variant || 'vanilla' }}"
          echo "🔐 SHA256: ${{ steps.download_rom.outputs.sha256 }}"
          echo "📝 Release draft created"